name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64 \
            g++-mingw-w64-i686

      - name: Build
        run: ./build.sh

      - name: Checksum
        run: sha256sum build/magicmida.exe > build/magicmida.exe.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/magicmida.exe \
            build/magicmida.exe.sha256 \
            --generate-notes
