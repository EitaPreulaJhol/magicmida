set noparent
linelength=80

# Deferred or project-specific checks:
# - legal/copyright: license boilerplate pass pending.
# - runtime/int: long/long long -> int64_t migration pending.
# - build/include_order: the project groups project, system, then std headers;
#   the include-order cleanup is a separate change.
# - build/include_subdir: headers are included through the src/ include dir.
# - build/header_guard: guards use the project prefix (MAGICMIDA_*_H_), not
#   the SRC_* form cpplint infers from the path.
# - whitespace/indent_namespace: cpplint misreads clang-format's aligned
#   continuation lines as namespace indentation.
filter=-legal/copyright,-runtime/int,-build/include_order,-build/include_subdir,-build/header_guard,-whitespace/indent_namespace
